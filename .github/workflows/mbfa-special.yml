# .github/workflows/mbfa-special.yml
name: MBFA Special Benchmark

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  parse-commit:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check trigger
        id: check
        run: |
          SHOULD_RUN="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN="true"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE '\-\-(special|all)'; then
              SHOULD_RUN="true"
            fi
          fi
          echo "should_run=${SHOULD_RUN}" >> $GITHUB_OUTPUT
          echo "Will run special benchmark: ${SHOULD_RUN}"

  gen-files:
    runs-on: ubuntu-latest
    needs: parse-commit
    if: needs.parse-commit.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate special benchmark files
        run: |
          mkdir -p bench_files_special
          python3 scripts/gen_special_files.py --output-dir bench_files_special
          echo "Generated files:"
          ls -lh bench_files_special/
          echo "Manifest:"
          cat bench_files_special/special_manifest.json

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: special-bench-files-${{ github.run_number }}
          path: bench_files_special/
          retention-days: 7

  benchmark:
    runs-on: ubuntu-latest
    needs: [parse-commit, gen-files]
    if: needs.parse-commit.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gzip zstd xz-utils zpaq brotli bc

      - name: Build Release
        run: cargo build --release

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: special-bench-files-${{ github.run_number }}
          path: bench_files_special/

      - name: Roundtrip smoke test
        run: |
          echo "Running roundtrip on all special files..."
          FAILED=0

          for f in bench_files_special/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"

            case "$name" in
              special_manifest.json) continue ;;
              *.mbfa|*.recovered|*.gz|*.zst|*.xz|*.br|*.zpaq) continue ;;
            esac

            if ! ./target/release/mbfa compress "$f" "${f}.mbfa" > /dev/null 2>&1; then
              echo "  FAIL: $name (compress error — exit $?)"
              FAILED=$((FAILED + 1))
              continue
            fi

            if ! ./target/release/mbfa decompress "${f}.mbfa" "${f}.recovered" > /dev/null 2>&1; then
              echo "  FAIL: $name (decompress error)"
              FAILED=$((FAILED + 1))
              continue
            fi

            if ! diff "$f" "${f}.recovered" > /dev/null 2>&1; then
              echo "  FAIL: $name (content mismatch)"
              FAILED=$((FAILED + 1))
            else
              echo "  OK:   $name"
            fi
          done

          echo ""
          if [ "$FAILED" != "0" ]; then
            echo "Roundtrip failures: $FAILED"
            exit 1
          fi
          echo "All roundtrips passed"

      - name: Run special benchmarks
        run: |
          fix_pct() { echo "$1" | sed 's/^\./0./'; }

          echo "[" > bench_files_special/special_results.json
          FIRST=true

          run_bench() {
            local file="$1"
            local name="$2"
            local category="$3"

            if [ ! -f "bench_files_special/$file" ]; then
              echo "  SKIP: $name (file not found)"
              return
            fi

            local orig_size
            orig_size=$(wc -c < "bench_files_special/$file")

            # ── MBFA ──────────────────────────────────────────────────────────
            local mbfa_start mbfa_end mbfa_ms mbfa_size
            mbfa_start=$(date +%s%N)
            ./target/release/mbfa compress "bench_files_special/$file" \
              "bench_files_special/${file}.mbfa" \
              > "/tmp/mbfa_log_${name}.txt" 2>&1 || true
            mbfa_end=$(date +%s%N)
            mbfa_ms=$(( (mbfa_end - mbfa_start) / 1000000 ))
            mbfa_size=$(wc -c < "bench_files_special/${file}.mbfa" 2>/dev/null || echo 0)

            local decomp_start decomp_end mbfa_decomp_ms
            decomp_start=$(date +%s%N)
            ./target/release/mbfa decompress "bench_files_special/${file}.mbfa" \
              "bench_files_special/${file}.recovered" > /dev/null 2>&1 || true
            decomp_end=$(date +%s%N)
            mbfa_decomp_ms=$(( (decomp_end - decomp_start) / 1000000 ))

            local roundtrip="PASS"
            if ! diff "bench_files_special/$file" \
                      "bench_files_special/${file}.recovered" > /dev/null 2>&1; then
              roundtrip="FAIL"
            fi

            local fold_detail
            fold_detail=$(grep -E "^(Original|Fold|Done|Joint|Entropy|Window|Filter|Stride|Binary|DixScript|STL|PLY|PE)" \
              "/tmp/mbfa_log_${name}.txt" 2>/dev/null | tr '\n' '|' | sed 's/"/\\"/g')

            # ── gzip ──────────────────────────────────────────────────────────
            local gz_s gz_e gz_ms gz_sz gz_ds gz_de gz_dms
            gz_s=$(date +%s%N)
            gzip -k -f "bench_files_special/$file" 2>/dev/null || true
            gz_e=$(date +%s%N); gz_ms=$(( (gz_e - gz_s) / 1000000 ))
            gz_sz=$(wc -c < "bench_files_special/${file}.gz" 2>/dev/null || echo 0)
            gz_ds=$(date +%s%N)
            gzip -d -k -f -c "bench_files_special/${file}.gz" > /dev/null 2>/dev/null || true
            gz_de=$(date +%s%N); gz_dms=$(( (gz_de - gz_ds) / 1000000 ))

            # ── zstd ──────────────────────────────────────────────────────────
            local zst_s zst_e zst_ms zst_sz zst_ds zst_de zst_dms
            zst_s=$(date +%s%N)
            zstd -q -f "bench_files_special/$file" \
              -o "bench_files_special/${file}.zst" 2>/dev/null || true
            zst_e=$(date +%s%N); zst_ms=$(( (zst_e - zst_s) / 1000000 ))
            zst_sz=$(wc -c < "bench_files_special/${file}.zst" 2>/dev/null || echo 0)
            zst_ds=$(date +%s%N)
            zstd -d -q -f -c "bench_files_special/${file}.zst" > /dev/null 2>/dev/null || true
            zst_de=$(date +%s%N); zst_dms=$(( (zst_de - zst_ds) / 1000000 ))

            # ── xz ────────────────────────────────────────────────────────────
            local xz_s xz_e xz_ms xz_sz xz_ds xz_de xz_dms
            xz_s=$(date +%s%N)
            xz -k -f "bench_files_special/$file" 2>/dev/null || true
            xz_e=$(date +%s%N); xz_ms=$(( (xz_e - xz_s) / 1000000 ))
            xz_sz=$(wc -c < "bench_files_special/${file}.xz" 2>/dev/null || echo 0)
            xz_ds=$(date +%s%N)
            xz -d -k -f -c "bench_files_special/${file}.xz" > /dev/null 2>/dev/null || true
            xz_de=$(date +%s%N); xz_dms=$(( (xz_de - xz_ds) / 1000000 ))

            # ── brotli ────────────────────────────────────────────────────────
            local br_s br_e br_ms br_sz br_ds br_de br_dms
            br_s=$(date +%s%N)
            brotli -k -f "bench_files_special/$file" \
              -o "bench_files_special/${file}.br" 2>/dev/null || true
            br_e=$(date +%s%N); br_ms=$(( (br_e - br_s) / 1000000 ))
            br_sz=$(wc -c < "bench_files_special/${file}.br" 2>/dev/null || echo 0)
            br_ds=$(date +%s%N)
            brotli -d -k -f -c "bench_files_special/${file}.br" > /dev/null 2>/dev/null || true
            br_de=$(date +%s%N); br_dms=$(( (br_de - br_ds) / 1000000 ))

            # ── zpaq ──────────────────────────────────────────────────────────
            local zpaq_s zpaq_e zpaq_ms zpaq_sz zpaq_dms
            zpaq_s=$(date +%s%N)
            zpaq a "bench_files_special/${file}.zpaq" "bench_files_special/$file" \
              -method 2 > /dev/null 2>&1 || true
            zpaq_e=$(date +%s%N); zpaq_ms=$(( (zpaq_e - zpaq_s) / 1000000 ))
            zpaq_sz=$(wc -c < "bench_files_special/${file}.zpaq" 2>/dev/null || echo 0)
            zpaq_dms=0
            if [ "$zpaq_sz" -gt 0 ]; then
              local zd_s zd_e
              zd_s=$(date +%s%N)
              zpaq e "bench_files_special/${file}.zpaq" \
                -to "/tmp/zpaq_decomp_$$" > /dev/null 2>&1 || true
              zd_e=$(date +%s%N)
              zpaq_dms=$(( (zd_e - zd_s) / 1000000 ))
              rm -rf "/tmp/zpaq_decomp_$$"
            fi

            # ── percentages ───────────────────────────────────────────────────
            local mbfa_pct gz_pct zst_pct xz_pct br_pct zpaq_pct
            mbfa_pct=$(fix_pct "$(echo "scale=2; $mbfa_size * 100 / $orig_size" | bc)")
            gz_pct=$(fix_pct   "$(echo "scale=2; $gz_sz   * 100 / $orig_size" | bc)")
            zst_pct=$(fix_pct  "$(echo "scale=2; $zst_sz  * 100 / $orig_size" | bc)")
            xz_pct=$(fix_pct   "$(echo "scale=2; $xz_sz   * 100 / $orig_size" | bc)")
            br_pct=$(fix_pct   "$(echo "scale=2; $br_sz   * 100 / $orig_size" | bc)")
            zpaq_pct=$(fix_pct "$(echo "scale=2; $zpaq_sz * 100 / $orig_size" | bc)")

            local all_pcts rank
            all_pcts="$mbfa_pct $gz_pct $zst_pct $xz_pct $br_pct $zpaq_pct"
            rank=$(echo "$all_pcts" | tr ' ' '\n' | sort -n | \
              grep -n "^${mbfa_pct}$" | head -1 | cut -d: -f1)
            [ -z "$rank" ] && rank="-"

            if [ "$FIRST" = "true" ]; then FIRST=false; else echo "," >> bench_files_special/special_results.json; fi

            printf '{\n  "dataset": "%s",\n  "category": "%s",\n  "original_bytes": %s,\n  "mbfa_bytes": %s, "mbfa_pct": %s, "mbfa_ms": %s, "mbfa_decomp_ms": %s,\n  "mbfa_roundtrip": "%s",\n  "mbfa_rank": %s,\n  "gzip_bytes": %s, "gzip_pct": %s, "gzip_ms": %s, "gzip_decomp_ms": %s,\n  "zstd_bytes": %s, "zstd_pct": %s, "zstd_ms": %s, "zstd_decomp_ms": %s,\n  "xz_bytes": %s, "xz_pct": %s, "xz_ms": %s, "xz_decomp_ms": %s,\n  "brotli_bytes": %s, "brotli_pct": %s, "brotli_ms": %s, "brotli_decomp_ms": %s,\n  "zpaq_bytes": %s, "zpaq_pct": %s, "zpaq_ms": %s, "zpaq_decomp_ms": %s,\n  "fold_detail": "%s"\n}' \
              "$name" "$category" "$orig_size" \
              "$mbfa_size" "$mbfa_pct" "$mbfa_ms" "$mbfa_decomp_ms" \
              "$roundtrip" "$rank" \
              "$gz_sz"   "$gz_pct"   "$gz_ms"   "$gz_dms" \
              "$zst_sz"  "$zst_pct"  "$zst_ms"  "$zst_dms" \
              "$xz_sz"   "$xz_pct"   "$xz_ms"   "$xz_dms" \
              "$br_sz"   "$br_pct"   "$br_ms"   "$br_dms" \
              "$zpaq_sz" "$zpaq_pct" "$zpaq_ms" "$zpaq_dms" \
              "$fold_detail" >> bench_files_special/special_results.json

            printf "%-34s [%-16s] %8s B | MBFA:%6s%%(#%-1s) C:%-4sms D:%-4sms | rt:%s\n" \
              "$name" "$category" "$orig_size" \
              "$mbfa_pct" "$rank" "$mbfa_ms" "$mbfa_decomp_ms" "$roundtrip"
          }

          echo "================================================================"
          echo "  MBFA Special Benchmark — Build #${{ github.run_number }}"
          echo "  $(date -u)"
          echo "================================================================"

          echo ""
          echo "── 3D Filter Targets ────────────────────────────────────────────"
          run_bench "mesh_sphere.stl"   "STL_Binary"       "3D_filter_target"
          run_bench "mesh_sphere.ply"   "PLY_Binary"       "3D_filter_target"
          run_bench "scene.glb"         "GLB_Binary"       "3D_filter_target"

          echo ""
          echo "── Unity Project Files ──────────────────────────────────────────"
          run_bench "Scripts.cs"        "Unity_CSharp"     "Unity"
          run_bench "SampleScene.unity" "Unity_YAML"       "Unity"
          run_bench "Terrain.raw"       "Unity_Terrain_1K" "Unity"
          run_bench "Terrain_large.raw" "Unity_Terrain_2K" "Unity"
          run_bench "Shaders.shader"    "Unity_Shaders"    "Unity"

          echo ""
          echo "── Unreal Project Files ─────────────────────────────────────────"
          run_bench "StaticMesh.uasset" "Unreal_uasset"    "Unreal"
          run_bench "plugins.json"      "Unreal_uplugin"   "Unreal"
          run_bench "DefaultEngine.ini" "Unreal_ini"       "Unreal"

          echo ""
          echo "── Config and Script Formats ────────────────────────────────────"
          run_bench "k8s_config.yaml"   "YAML_Config"      "Config"
          run_bench "services.toml"     "TOML_Config"      "Config"

          echo ""
          echo "── DixScript Formats ────────────────────────────────────────────"
          run_bench "platform.mdix"           "DixScript_Source"   "DixScript"
          run_bench "DixScript_compiled.mdix" "DixScript_Compiled" "DixScript"

          echo ""
          echo "── Binary / Assembly ────────────────────────────────────────────"
          run_bench "Assembly.dll"      "DLL_Assembly"     "Binary"

          echo ""
          echo "── MBFA Showcase ────────────────────────────────────────────────"
          run_bench "Showcase_Repetitive.bin" "Showcase_Repetitive" "Showcase"
          run_bench "Showcase_Sparse.bin"     "Showcase_Sparse"     "Showcase"
          run_bench "Showcase_GameMap.bin"    "Showcase_GameMap"    "Showcase"

          echo "]" >> bench_files_special/special_results.json

          echo ""
          echo "================================================================"
          echo "Lower % = better. rt = roundtrip."

      - name: Upload special results
        uses: actions/upload-artifact@v4
        with:
          name: special-results-${{ github.run_number }}
          path: bench_files_special/special_results.json
          retention-days: 90

  deploy:
    runs-on: ubuntu-latest
    needs: [parse-commit, benchmark]
    if: needs.parse-commit.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: special-results-${{ github.run_number }}
          path: special_results/

      - name: Generate special HTML report from template
        run: |
          BUILD_DATE=$(date -u)
          BUILD_NUM="${{ github.run_number }}"
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          cp .github/special-template.html special_results/index.html

          sed -i "s/BUILD_NUM_PLACEHOLDER/${BUILD_NUM}/g"  special_results/index.html
          sed -i "s/BRANCH_PLACEHOLDER/${BRANCH}/g"        special_results/index.html
          sed -i "s/COMMIT_PLACEHOLDER/${COMMIT:0:8}/g"    special_results/index.html
          sed -i "s|DATE_PLACEHOLDER|${BUILD_DATE}|g"      special_results/index.html

          echo "HTML report generated from template"

      - name: Deploy to gh-pages/special
        run: |
          git config --global user.name "MBFA CI"
          git config --global user.email "ci@mbfa.dev"

          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/special"
          cp special_results/index.html           "$WORK/special/index.html"
          cp special_results/special_results.json "$WORK/special/results.json"

          cd "$WORK"
          git add special/
          git diff --staged --quiet && echo "No changes to special/" && exit 0
          git commit -m "MBFA special benchmark — Build #${{ github.run_number }} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

          echo "Deployed to https://mid-d-man.github.io/mbfa/special/"

  summary:
    runs-on: ubuntu-latest
    needs: [parse-commit]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "MBFA Special Benchmark — Build #${{ github.run_number }}"
          echo "Triggered: ${{ needs.parse-commit.outputs.should_run }}"
          echo "Use --special or --all in commit message to run special benchmarks."
