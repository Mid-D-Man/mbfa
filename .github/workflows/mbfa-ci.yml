# .github/workflows/mbfa-ci.yml
name: MBFA Build & Benchmark

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  parse-commit:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      should_special: ${{ steps.check.outputs.should_special }}
    steps:
      - name: Check for publish/special flags
        id: check
        run: |
          SHOULD_PUBLISH="false"
          SHOULD_SPECIAL="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_PUBLISH="true"
            SHOULD_SPECIAL="true"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE '\-\-(publish|deploy|all)'; then
              SHOULD_PUBLISH="true"
            fi
            if echo "$COMMIT_MSG" | grep -qiE '\-\-(special|all)'; then
              SHOULD_SPECIAL="true"
            fi
          fi
          echo "should_publish=${SHOULD_PUBLISH}" >> $GITHUB_OUTPUT
          echo "should_special=${SHOULD_SPECIAL}"  >> $GITHUB_OUTPUT
          echo "Will publish: ${SHOULD_PUBLISH} | Will run special: ${SHOULD_SPECIAL}"

  build-and-test:
    runs-on: ${{ matrix.os }}
    needs: parse-commit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt -- --check || true

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy-${{ matrix.os }}.txt || true

      - name: Build Debug
        run: cargo build --verbose 2>&1 | tee build-debug-${{ matrix.os }}.txt

      - name: Build Release
        run: cargo build --release --verbose 2>&1 | tee build-release-${{ matrix.os }}.txt

      - name: Run Tests
        run: cargo test --verbose 2>&1 | tee test-${{ matrix.os }}.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}-${{ github.run_number }}
          path: "*.txt"
          retention-days: 30

  update-structure:
    runs-on: ubuntu-latest
    needs: [parse-commit, build-and-test]
    if: needs.parse-commit.outputs.should_publish == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ProjectStructure.txt
        run: |
          mkdir -p others
          {
            echo "Project Structure — MidMans Bit Folding Algorithm (MBFA)"
            echo "MidManStudio"
            echo "Generated: $(date -u)"
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Build: #${{ github.run_number }}"
            echo "=================================="
            echo
            echo "Source Files:"
            find src -type f -name "*.rs" | sort
            echo
            echo "Bench Files:"
            find benches -type f -name "*.rs" 2>/dev/null | sort || echo "None"
            echo
            echo "Config:"
            ls -1 *.toml *.md 2>/dev/null | sort
            echo
            echo "Counts:"
            echo "  src: $(find src -type f -name '*.rs' | wc -l) files"
            echo "  benches: $(find benches -type f -name '*.rs' 2>/dev/null | wc -l || echo 0) files"
          } > others/ProjectStructure.txt
          cat others/ProjectStructure.txt

      - name: Commit structure update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MBFA CI"
          git add others/ProjectStructure.txt
          git diff --staged --quiet || git commit -m "Auto-update project structure — Build #${{ github.run_number }} [skip ci]"
          git push || true

  benchmark:
    runs-on: ubuntu-latest
    needs: [parse-commit, build-and-test]
    if: needs.parse-commit.outputs.should_publish == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gzip zstd xz-utils zpaq brotli bc imagemagick python3-pil

      - name: Build Release
        run: cargo build --release

      - name: Prepare benchmark files
        run: |
          mkdir -p bench_files bench_results

          python3 -c "print('the the the and the and ' * 500)" > bench_files/repetitive.txt
          python3 -c "import os; open('bench_files/random.bin','wb').write(os.urandom(10000))"
          cp src/encoder.rs bench_files/source_code.rs
          curl -s -o bench_files/alice.txt "https://www.gutenberg.org/files/11/11-0.txt" || \
            python3 -c "print('the quick brown fox ' * 5000)" > bench_files/alice.txt
          head -c 20000  bench_files/alice.txt > bench_files/alice_small.txt
          head -c 100000 bench_files/alice.txt > bench_files/alice_100k.txt

          python3 -c "
          import json, random
          random.seed(42)
          names  = ['alice','bob','charlie','diana','eve','frank','grace','henry']
          cities = ['london','paris','berlin','tokyo','sydney','cairo','oslo','lima']
          records = []
          for i in range(500):
              records.append({
                  'id': i, 'name': random.choice(names),
                  'email': f'user{i}@example.com', 'city': random.choice(cities),
                  'score': round(random.uniform(0,100),2),
                  'active': random.choice([True,False]),
                  'tags': random.sample(['admin','user','guest','mod'],2)
              })
          open('bench_files/data.json','w').write(json.dumps({'records':records},indent=2))
          "

          python3 -c "
          import struct, math
          sr = 44100; dur = 0.5; n = int(sr * dur)
          pcm = [int((math.sin(2*math.pi*440*i/sr)*0.5 +
                      math.sin(2*math.pi*880*i/sr)*0.3 +
                      math.sin(2*math.pi*220*i/sr)*0.2) * 32767) for i in range(n)]
          pcm_bytes = struct.pack(f'<{n}h', *pcm)
          fmt  = b'fmt ' + struct.pack('<IHHIIHH', 16, 1, 1, sr, sr*2, 2, 16)
          data = b'data' + struct.pack('<I', len(pcm_bytes)) + pcm_bytes
          body = b'WAVE' + fmt + data
          open('bench_files/audio.wav','wb').write(b'RIFF' + struct.pack('<I', len(body)) + body)
          "

          python3 -c "
          import struct
          w, h = 100, 100; pad = (4 - (w*3) % 4) % 4; px_sz = (w*3 + pad) * h
          hdr = (b'BM' + struct.pack('<I', 54+px_sz) + struct.pack('<HH',0,0) +
                 struct.pack('<I', 54) + struct.pack('<IiiHHIIiiII',40,w,h,1,24,0,px_sz,2835,2835,0,0))
          rows = []
          for y in range(h):
              row = b''
              for x in range(w):
                  row += bytes([int(x/w*255), int(y/h*255), int((x+y)/(w+h)*255)])
              rows.append(row + b'\x00'*pad)
          open('bench_files/image.bmp','wb').write(hdr + b''.join(reversed(rows)))
          "

          convert -size 256x256 plasma: -depth 8 bench_files/image_png_small.png
          convert -size 1024x1024 plasma: -depth 8 bench_files/image_png_large.png

          python3 -c "
          import struct, random
          random.seed(7)
          w, h = 512, 512
          import math
          rows = []
          for y in range(h):
              row = bytearray()
              for x in range(w):
                  r = int(x / w * 200 + random.gauss(0, 8)) % 256
                  g = int(y / h * 200 + random.gauss(0, 8)) % 256
                  b = int((x + y) / (w + h) * 200 + random.gauss(0, 8)) % 256
                  row += bytes([max(0,min(255,r)), max(0,min(255,g)), max(0,min(255,b))])
              rows.append(bytes(row))
          header = f'P6\n{w} {h}\n255\n'.encode()
          with open('/tmp/photo_raw.ppm', 'wb') as f:
              f.write(header)
              for row in rows:
                  f.write(row)
          "
          convert /tmp/photo_raw.ppm -quality 85 bench_files/photo.jpg

          python3 -c "
          import struct, math, random
          random.seed(13)
          def pack_float_array(vals):
              return struct.pack(f'<{len(vals)}f', *vals)
          def pack_int_array(vals):
              return struct.pack(f'<{len(vals)}i', *vals)
          vertices = []; normals = []; uvs = []; indices = []
          rings = 40; segs = 40
          for r in range(rings + 1):
              phi = math.pi * r / rings
              for s in range(segs):
                  theta = 2 * math.pi * s / segs
                  x = math.sin(phi) * math.cos(theta)
                  y = math.cos(phi)
                  z = math.sin(phi) * math.sin(theta)
                  vertices.extend([x*100 + random.gauss(0,0.002), y*100 + random.gauss(0,0.002), z*100 + random.gauss(0,0.002)])
                  normals.extend([x, y, z])
                  uvs.extend([s/segs, r/rings])
          for r in range(rings):
              for s in range(segs):
                  a = r*(segs+1)+s; b = a+segs+1
                  indices.extend([a, b, a+1, b, b+1, a+1])
          magic = b'Kaydara FBX Binary  \x00\x1a\x00' + struct.pack('<I', 7400)
          body = pack_float_array(vertices) + pack_float_array(normals) + pack_float_array(uvs) + pack_int_array(indices) + b'\x00'*13
          open('bench_files/mesh.fbx','wb').write(magic+body)
          "

          echo "Downloading War and Peace..."
          if curl -fsSL --retry 3 --max-time 60 \
              "https://www.gutenberg.org/files/2600/2600-0.txt" \
              -o bench_files/prose_3mb.txt 2>/dev/null; then
            echo "War and Peace: $(wc -c < bench_files/prose_3mb.txt) bytes"
          else
            cat bench_files/alice.txt bench_files/alice.txt bench_files/alice.txt \
                bench_files/alice.txt bench_files/alice.txt bench_files/alice.txt \
                bench_files/alice.txt bench_files/alice.txt > bench_files/prose_3mb.txt
          fi

          python3 -c "
          unit = ('the the the and the and the cat sat on the mat and the rat was fat ' * 8 +
                  'hello world foo bar baz qux the end and the beginning ' * 4)
          target = 2 * 1024 * 1024
          out = (unit * (target // len(unit) + 1))[:target]
          open('bench_files/repetitive_2mb.txt', 'w').write(out)
          "

          python3 -c "
          import json, random
          random.seed(99)
          names    = ['alice','bob','charlie','diana','eve','frank','grace','henry',
                      'ivan','julia','karl','lena','mike','nina','oscar','paula']
          cities   = ['london','paris','berlin','tokyo','sydney','cairo','oslo','lima',
                      'moscow','delhi','chicago','dubai','seoul','toronto','madrid','rome']
          products = ['widget','gadget','doohickey','thingamajig','whatsit','gizmo',
                      'contraption','device','apparatus','mechanism']
          records = []
          for i in range(8000):
              records.append({
                  'id': i, 'name': random.choice(names),
                  'email': f'user{i}@example.com', 'city': random.choice(cities),
                  'country': random.choice(['US','UK','DE','JP','AU','FR','CA','BR']),
                  'score': round(random.uniform(0,100), 2),
                  'rank': random.randint(1, 1000),
                  'active': random.choice([True, False]),
                  'product': random.choice(products),
                  'quantity': random.randint(1, 500),
                  'tags': random.sample(['admin','user','guest','mod','viewer','editor'], 2),
                  'notes': f'Record {i} created automatically for benchmark testing purposes'
              })
          open('bench_files/data_2mb.json','w').write(json.dumps({'version':1,'records':records},indent=2))
          "

          cat src/*.rs > /tmp/all_src_once.rs
          python3 -c "
          src = open('/tmp/all_src_once.rs').read()
          target = 1048576
          out = (src * (target // len(src) + 1))[:target]
          open('bench_files/source_1mb.rs','w').write(out)
          "

          echo "All benchmark files:"
          ls -lh bench_files/

      - name: Roundtrip verification
        run: |
          echo "the the the and the and the and the cat sat on the mat" > bench_files/roundtrip_test.txt
          ./target/release/mbfa compress bench_files/roundtrip_test.txt bench_files/roundtrip_test.mbfa
          ./target/release/mbfa decompress bench_files/roundtrip_test.mbfa bench_files/roundtrip_recovered.txt
          if diff bench_files/roundtrip_test.txt bench_files/roundtrip_recovered.txt > /dev/null 2>&1; then
            echo "ROUNDTRIP: PASSED"
          else
            echo "ROUNDTRIP: FAILED"
            exit 1
          fi

      - name: Run benchmarks
        run: |
          fix_pct() { echo "$1" | sed 's/^\./0./'; }

          echo "[" > bench_results/results.json
          FIRST=true

          run_bench() {
            local file=$1
            local name=$2
            local orig_size
            orig_size=$(wc -c < "bench_files/$file")

            local mbfa_start mbfa_end mbfa_ms mbfa_size
            mbfa_start=$(date +%s%N)
            ./target/release/mbfa compress "bench_files/$file" "bench_files/$file.mbfa" \
              > bench_results/mbfa_log_${name}.txt 2>&1
            mbfa_end=$(date +%s%N)
            mbfa_ms=$(( (mbfa_end - mbfa_start) / 1000000 ))
            mbfa_size=$(wc -c < "bench_files/$file.mbfa" 2>/dev/null || echo 0)

            local fold_detail
            fold_detail=$(grep -E "^(Original|Fold|Done|Joint|Entropy|Window|Wide|PNG|Filter)" \
              bench_results/mbfa_log_${name}.txt | tr '\n' '|' | sed 's/"/\\"/g')

            local decomp_start decomp_end mbfa_decomp_ms
            decomp_start=$(date +%s%N)
            ./target/release/mbfa decompress "bench_files/$file.mbfa" "bench_files/$file.recovered" \
              > /dev/null 2>&1
            decomp_end=$(date +%s%N)
            mbfa_decomp_ms=$(( (decomp_end - decomp_start) / 1000000 ))

            local roundtrip="PASS"
            if ! diff "bench_files/$file" "bench_files/$file.recovered" > /dev/null 2>&1; then
              roundtrip="FAIL"
            fi

            local gz_start gz_end gz_ms gz_size gz_decomp_start gz_decomp_end gz_decomp_ms
            gz_start=$(date +%s%N)
            gzip -k -f "bench_files/$file" 2>/dev/null
            gz_end=$(date +%s%N)
            gz_ms=$(( (gz_end - gz_start) / 1000000 ))
            gz_size=$(wc -c < "bench_files/$file.gz" 2>/dev/null || echo 0)
            gz_decomp_start=$(date +%s%N)
            gzip -d -k -f -c "bench_files/$file.gz" > /dev/null 2>/dev/null
            gz_decomp_end=$(date +%s%N)
            gz_decomp_ms=$(( (gz_decomp_end - gz_decomp_start) / 1000000 ))

            local zst_start zst_end zst_ms zst_size zst_decomp_start zst_decomp_end zst_decomp_ms
            zst_start=$(date +%s%N)
            zstd -q -f "bench_files/$file" -o "bench_files/$file.zst" 2>/dev/null
            zst_end=$(date +%s%N)
            zst_ms=$(( (zst_end - zst_start) / 1000000 ))
            zst_size=$(wc -c < "bench_files/$file.zst" 2>/dev/null || echo 0)
            zst_decomp_start=$(date +%s%N)
            zstd -d -q -f -c "bench_files/$file.zst" > /dev/null 2>/dev/null
            zst_decomp_end=$(date +%s%N)
            zst_decomp_ms=$(( (zst_decomp_end - zst_decomp_start) / 1000000 ))

            local xz_start xz_end xz_ms xz_size xz_decomp_start xz_decomp_end xz_decomp_ms
            xz_start=$(date +%s%N)
            xz -k -f "bench_files/$file" 2>/dev/null
            xz_end=$(date +%s%N)
            xz_ms=$(( (xz_end - xz_start) / 1000000 ))
            xz_size=$(wc -c < "bench_files/$file.xz" 2>/dev/null || echo 0)
            xz_decomp_start=$(date +%s%N)
            xz -d -k -f -c "bench_files/$file.xz" > /dev/null 2>/dev/null
            xz_decomp_end=$(date +%s%N)
            xz_decomp_ms=$(( (xz_decomp_end - xz_decomp_start) / 1000000 ))

            local br_start br_end br_ms br_size br_decomp_start br_decomp_end br_decomp_ms
            br_start=$(date +%s%N)
            brotli -k -f "bench_files/$file" -o "bench_files/$file.br" 2>/dev/null
            br_end=$(date +%s%N)
            br_ms=$(( (br_end - br_start) / 1000000 ))
            br_size=$(wc -c < "bench_files/$file.br" 2>/dev/null || echo 0)
            br_decomp_start=$(date +%s%N)
            brotli -d -k -f -c "bench_files/$file.br" > /dev/null 2>/dev/null
            br_decomp_end=$(date +%s%N)
            br_decomp_ms=$(( (br_decomp_end - br_decomp_start) / 1000000 ))

            local zpaq_start zpaq_end zpaq_ms zpaq_size zpaq_decomp_ms
            zpaq_start=$(date +%s%N)
            zpaq a "bench_files/$file.zpaq" "bench_files/$file" -method 2 > /dev/null 2>&1 || true
            zpaq_end=$(date +%s%N)
            zpaq_ms=$(( (zpaq_end - zpaq_start) / 1000000 ))
            zpaq_size=$(wc -c < "bench_files/$file.zpaq" 2>/dev/null || echo 0)
            zpaq_decomp_ms=0
            if [ "$zpaq_size" -gt 0 ]; then
              local zpaq_d_start zpaq_d_end
              zpaq_d_start=$(date +%s%N)
              zpaq e "bench_files/$file.zpaq" -to /tmp/zpaq_decomp_$$ > /dev/null 2>&1 || true
              zpaq_d_end=$(date +%s%N)
              zpaq_decomp_ms=$(( (zpaq_d_end - zpaq_d_start) / 1000000 ))
              rm -rf /tmp/zpaq_decomp_$$
            fi

            local mbfa_pct gz_pct zst_pct xz_pct br_pct zpaq_pct
            mbfa_pct=$(fix_pct "$(echo "scale=2; $mbfa_size * 100 / $orig_size" | bc)")
            gz_pct=$(fix_pct   "$(echo "scale=2; $gz_size   * 100 / $orig_size" | bc)")
            zst_pct=$(fix_pct  "$(echo "scale=2; $zst_size  * 100 / $orig_size" | bc)")
            xz_pct=$(fix_pct   "$(echo "scale=2; $xz_size   * 100 / $orig_size" | bc)")
            br_pct=$(fix_pct   "$(echo "scale=2; $br_size   * 100 / $orig_size" | bc)")
            zpaq_pct=$(fix_pct "$(echo "scale=2; $zpaq_size * 100 / $orig_size" | bc)")

            local all_pcts rank
            all_pcts="$mbfa_pct $gz_pct $zst_pct $xz_pct $br_pct $zpaq_pct"
            rank=$(echo "$all_pcts" | tr ' ' '\n' | sort -n | \
              grep -n "^${mbfa_pct}$" | head -1 | cut -d: -f1)
            [ -z "$rank" ] && rank="-"

            if [ "$FIRST" = "true" ]; then
              FIRST=false
            else
              echo "," >> bench_results/results.json
            fi

            cat >> bench_results/results.json << EOJSON
{
  "dataset": "$name",
  "original_bytes": $orig_size,
  "mbfa_bytes": $mbfa_size,   "mbfa_pct": $mbfa_pct,   "mbfa_ms": $mbfa_ms,   "mbfa_decomp_ms": $mbfa_decomp_ms,
  "mbfa_roundtrip": "$roundtrip",
  "mbfa_rank": $rank,
  "gzip_bytes": $gz_size,     "gzip_pct": $gz_pct,     "gzip_ms": $gz_ms,     "gzip_decomp_ms": $gz_decomp_ms,
  "zstd_bytes": $zst_size,    "zstd_pct": $zst_pct,    "zstd_ms": $zst_ms,    "zstd_decomp_ms": $zst_decomp_ms,
  "xz_bytes": $xz_size,       "xz_pct": $xz_pct,       "xz_ms": $xz_ms,       "xz_decomp_ms": $xz_decomp_ms,
  "brotli_bytes": $br_size,   "brotli_pct": $br_pct,   "brotli_ms": $br_ms,   "brotli_decomp_ms": $br_decomp_ms,
  "zpaq_bytes": $zpaq_size,   "zpaq_pct": $zpaq_pct,   "zpaq_ms": $zpaq_ms,   "zpaq_decomp_ms": $zpaq_decomp_ms,
  "fold_detail": "$fold_detail"
}
EOJSON

            local rank_str="#${rank}"
            printf "%-28s %9s B | MBFA:%6s%%(%-2s) C:%-4sms D:%-4sms | gz C:%-4sms D:%-4sms | rt:%s\n" \
              "$name" "$orig_size" \
              "$mbfa_pct" "$rank_str" \
              "$mbfa_ms" "$mbfa_decomp_ms" \
              "$gz_ms"   "$gz_decomp_ms" \
              "$roundtrip"
          }

          echo "================================================================"
          echo "  MidMans Bit Folding Algorithm — Extended Benchmark"
          echo "  Build #${{ github.run_number }} | $(date -u)"
          echo "  C = compress ms   D = decompress ms"
          echo "================================================================"
          echo ""
          echo "── Small / Medium ───────────────────────────────────────────────"
          run_bench "repetitive.txt"      "Repetitive_12KB"
          run_bench "alice_small.txt"     "Prose_Alice_20KB"
          run_bench "alice_100k.txt"      "Prose_Alice_100KB"
          run_bench "random.bin"          "Random_10KB"
          run_bench "source_code.rs"      "Source_Code"
          run_bench "data.json"           "JSON_100KB"
          run_bench "audio.wav"           "Audio_WAV_44KB"
          run_bench "image.bmp"           "Image_BMP_29KB"
          run_bench "image_png_small.png" "Image_PNG_Small"
          run_bench "image_png_large.png" "Image_PNG_1MB"
          run_bench "photo.jpg"           "Image_JPEG_512"
          run_bench "mesh.fbx"            "Mesh_FBX"
          echo ""
          echo "── Large (MB scale) ─────────────────────────────────────────────"
          run_bench "prose_3mb.txt"       "Prose_WarAndPeace_3MB"
          run_bench "repetitive_2mb.txt"  "Repetitive_2MB"
          run_bench "data_2mb.json"       "JSON_2MB"
          run_bench "source_1mb.rs"       "Source_1MB"

          echo "]" >> bench_results/results.json

          echo ""
          echo "================================================================"
          echo "Lower % = better. C = compress time, D = decompress time (ms)."
          echo "Rank = MBFA position among all 6 algorithms."

      - name: Run offset profile analysis
        run: |
          echo "================================================================"
          echo "  MBFA — Recent Offset Reuse Profile"
          echo "  Build #${{ github.run_number }} | $(date -u)"
          echo "================================================================"
          echo ""
          ./target/release/profile_offsets \
            bench_files/alice_small.txt \
            bench_files/alice_100k.txt \
            bench_files/prose_3mb.txt \
            bench_files/repetitive.txt \
            bench_files/repetitive_2mb.txt \
            bench_files/source_code.rs \
            bench_files/source_1mb.rs \
            bench_files/data.json \
            bench_files/data_2mb.json \
            bench_files/audio.wav \
            bench_files/image.bmp \
            bench_files/image_png_small.png \
            bench_files/image_png_large.png \
            bench_files/photo.jpg \
            bench_files/mesh.fbx \
            2>&1 | tee bench_results/offset_profile.txt

      - name: Run offset profile on Canterbury corpus
        run: |
          if [ ! -d corpus_files ] || [ -z "$(ls -A corpus_files 2>/dev/null)" ]; then
            mkdir -p corpus_files
            if curl -fsSL --retry 3 \
                "http://corpus.canterbury.ac.nz/resources/cantrbry.tar.gz" \
                -o /tmp/cantrbry.tar.gz 2>/dev/null; then
              tar -xzf /tmp/cantrbry.tar.gz -C corpus_files/ 2>/dev/null || \
                tar -xzf /tmp/cantrbry.tar.gz -C corpus_files/ --strip-components=1
            else
              echo "Canterbury corpus download failed — skipping"
            fi
          fi
          if [ -d corpus_files ] && [ -n "$(ls -A corpus_files 2>/dev/null)" ]; then
            echo ""
            echo "── Canterbury Corpus Offset Profile ─────────────────────────"
            ./target/release/profile_offsets corpus_files/* \
              2>&1 | tee bench_results/offset_profile_canterbury.txt
          fi

      - name: Generate HTML report
        run: |
          BUILD_DATE=$(date -u)
          BUILD_NUM="${{ github.run_number }}"
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          cp .github/benchmark-template.html bench_results/index.html

          sed -i "s/BUILD_NUM_PLACEHOLDER/${BUILD_NUM}/g"  bench_results/index.html
          sed -i "s/BRANCH_PLACEHOLDER/${BRANCH}/g"        bench_results/index.html
          sed -i "s/COMMIT_PLACEHOLDER/${COMMIT:0:8}/g"    bench_results/index.html
          sed -i "s|DATE_PLACEHOLDER|${BUILD_DATE}|g"      bench_results/index.html

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: bench_results/
          retention-days: 90

  trigger-special:
    runs-on: ubuntu-latest
    needs: [parse-commit, build-and-test]
    if: needs.parse-commit.outputs.should_special == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger special benchmark workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'mbfa-special.yml',
              ref: context.ref,
            });
            console.log('Special benchmark workflow triggered');

  deploy-report:
    runs-on: ubuntu-latest
    needs: [parse-commit, benchmark]
    if: needs.parse-commit.outputs.should_publish == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: bench_results

      - name: Deploy to gh-pages
        run: |
          git config --global user.name "MBFA CI"
          git config --global user.email "ci@mbfa.dev"

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add /tmp/gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
          fi

          mkdir -p /tmp/gh-pages/builds/build_${{ github.run_number }}
          cp -r bench_results/* /tmp/gh-pages/builds/build_${{ github.run_number }}/
          cp -r bench_results/* /tmp/gh-pages/

          cp .github/mbfa-visual.html /tmp/gh-pages/visual.html

          cd /tmp/gh-pages
          git add .
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "MBFA benchmark — Build #${{ github.run_number }} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

          echo "Deployed to https://mid-d-man.github.io/mbfa/"

  summary:
    runs-on: ubuntu-latest
    needs: [parse-commit, build-and-test]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "=================================="
          echo "  MBFA — MidMans Bit Folding Algorithm"
          echo "  MidManStudio"
          echo "=================================="
          echo "Build:     #${{ github.run_number }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Published: ${{ needs.parse-commit.outputs.should_publish }}"
          echo "Special:   ${{ needs.parse-commit.outputs.should_special }}"
          echo ""
          echo "Commit message flags:"
          echo "  --publish / --deploy  run benchmark suite + deploy"
          echo "  --special             run special benchmark suite"
          echo "  --corp                run Canterbury corpus benchmark"
          echo "  --archive             run archive benchmark"
          echo "  --all                 run ALL benchmark suites"
